server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Suppress Nginx version disclosure in headers and error pages
    server_tokens off;

    # Ensure correct MIME type handling, including WebAssembly
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Enable gzip compression for optimized network transfer
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Static assets: cache aggressively and return 404 if missing (do NOT fallback to index.html)
    location ~* \.(?:css|js|map|json|wasm|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entry point & service worker: prevent stale cache on application updates
    location ~* (?:index\.html|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # SPA routing fallback: forward client routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
